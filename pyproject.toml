[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-module"
version = "1.0.0"
description = "Vade memory module: two-layer storage, dedupe, recall, admin RPC"
requires-python = ">=3.10"
dependencies = ["vade-sdk==0.1.*"]

[project.optional-dependencies]
core = ["vade-sdk[core]==0.1.*"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
